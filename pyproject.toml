    "transformers>=5.23.0",
]

[project.scripts]
sentiment-lstm-vs-bert = "sentiment_lstm_vs_bert:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
