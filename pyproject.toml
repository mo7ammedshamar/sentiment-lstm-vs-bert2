    { name = "mo7ammedshamar", email = "mo7amedshammar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "evaluate>=0.4.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
